<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contacto - Mi Empresa</title>
</head>
<body style="background-color: #F4F6F7; font-family: Arial, sans-serif; color: #2C3E50; margin: 20px;">

    <nav style="background-color: #117864; padding: 15px; text-align: center;">
        <a href="index.html" style="color: white; margin: 0 15px; text-decoration: none; font-weight: bold;">Inicio</a> 
        <a href="productos.html" style="color: white; margin: 0 15px; text-decoration: none; font-weight: bold;">Nuestros Productos</a> 
        <a href="contacto.html" style="color: white; margin: 0 15px; text-decoration: none; font-weight: bold;">Escríbenos y Ubicación</a>
    </nav>

    <h1 style="color: #117864; text-align: center; margin-top: 30px;">Contacto y Ubicación</h1>
    <hr style="border: 1px solid #117864;">

    <div style="background-color: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 30px; max-width: 500px;">
        <h3>📩 Escríbenos</h3>
        <form>
            <label>Nombre Completo:</label><br>
            <input type="text" style="width: 100%; padding: 8px; margin: 8px 0;" placeholder="Tu nombre..."><br>

            <label>Correo Electrónico:</label><br>
            <input type="email" style="width: 100%; padding: 8px; margin: 8px 0;" placeholder="tu@correo.com"><br>

            <label>Mensaje:</label><br>
            <textarea rows="4" style="width: 100%; padding: 8px; margin: 8px 0;" placeholder="¿En qué te podemos ayudar?"></textarea><br>

            <input type="submit" value="Enviar Mensaje" style="background-color: #117864; color: white; border: none; padding: 10px 20px; border-radius: 50px; cursor: pointer;">
        </form>
    </div>

    <div style="background-color: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
        <h3>📍 Nuestra Ubicación</h3>
        <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d15694.757048700201!2d-73.25!3d10.466667!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1ses!2sco!4v1700000000000" 
                width="100%" height="350" style="border:0; border-radius: 5px;" allowfullscreen="" loading="lazy">
        </iframe >
    </div>

</body>
</html>
